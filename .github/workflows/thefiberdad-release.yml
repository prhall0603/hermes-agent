# The Fiber Dad desktop app — release build.
#
# Tag a branded build as `tdfd-v*` (e.g. tdfd-v0.21.3) and this workflow builds
# installers for Windows (MSIX + NSIS), macOS (DMG + ZIP) and Linux (AppImage),
# then publishes them on the tag's GitHub Release.
#
#   HERMES_DESKTOP_VARIANT=fiberdad  -> "The Fiber Dad" identity (see
#   apps/desktop/product-identity.cjs for the single derivation of every
#   name-shaped value the variant owns).
#
# Artifacts are unsigned; Windows NSIS + Developer-Mode MSIX sideload cleanly,
# macOS needs right-click > Open on first launch (Gatekeeper).

name: Fiber Dad Desktop Release

on:
  push:
    tags:
      - 'tdfd-v*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: thefiberdad-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set up uv (python package manager)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Stamp the installer version from the tag
        if: startsWith(github.ref, 'refs/tags/tdfd-v')
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#tdfd-v}"
          cd apps/desktop
          npm version "$VER" --no-git-tag-version
          grep -m1 '"version"' package.json

      - name: Build the Fiber Dad desktop installer
        env:
          # No signing credentials on hand — electron-builder skips signing
          # when the relevant env vars are unset.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # scripts/build/python.mjs refuses to guess an interpreter.
          HERMES_PYTHON: python
          # GPU-only pinned tools; GH runners have no CUDA/ROCm drivers so
          # their staged-entry verification fails. Bundled installs serve
          # models via Ollama instead.
          HERMES_PAYLOAD_TOOL_SKIP: llamacpp-cuda,llamacpp-hip
        shell: bash
        run: cd apps/desktop && npm run dist:fiberdad

      - name: Collect installer artifacts
        shell: bash
        run: |
          dest="${RUNNER_TEMP}/fds-release"
          mkdir -p "$dest"
          # Ship the one-command installers with every release: stable URLs
          # (releases/latest/download/fd-install.sh) resolve to the newest
          # tag's copy. The icon covers the Linux launcher entry.
          cp -v scripts/fd-install.sh scripts/fd-install.ps1 "$dest/"
          cp -v apps/desktop/assets/icon.png "$dest/thefiberdad-icon.png"
          # electron-builder writes to apps/desktop/release; keep dist/ covered too.
          for dir in apps/desktop/release apps/desktop/dist; do
            if [ -d "$dir" ]; then
              cp -v "$dir"/*.msix "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.exe "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.appinstaller "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.dmg "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.zip "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.AppImage "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.deb "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.rpm "$dest/" 2>/dev/null || true
              cp -v "$dir"/*.blockmap "$dest/" 2>/dev/null || true
            fi
          done
          ls -la "$dest"

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: the-fiber-dad-desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/fds-release/*
          if-no-files-found: error

      - name: Attach to the GitHub Release (tag runs only)
        if: startsWith(github.ref, 'refs/tags/tdfd-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/fds-release/*
          draft: false
          prerelease: false